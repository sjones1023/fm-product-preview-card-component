<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <link rel="stylesheet" href="style.css" />
    

    <title>Frontend Mentor | Product preview card component</title>
    
  </head>
  <body>
    <main class="wrapper">
      <article class="card">
        <div class="card-grid">
          
          <picture>
            <source 
              srcset="assets/images/image-product-desktop.jpg" 
              media="(width >= 768px)"
            />
            <img class="card__image" src="assets/images/image-product-mobile.jpg" alt="Chanel Perfume" />
          </picture>
            
          
          
          <section class="card-body">
            <section class="card-header">
              <span class="item-category">Perfume</span>
              <h1 class="card-title">Gabrielle Essence Eau De Parfum</h1>
            </section>
            
            <p>A floral, solar and voluptuous
            interpretation composed by Olivier Polge, Perfumer-Creator for the House of
            CHANEL.</p>

            <div class="price-info">
             	<p>$149.99</p>
             	<p>$169.99</p>
            </div> 
              
            <a class="button" href="#">
              <img src="assets/images/icon-cart.svg " alt="cart">
              Add to Cart
            </a>
          </section>
        </div>
      </article>
    </main>
        
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">S. Tyler Jones</a>.
    </footer>

  </body>
</html>
